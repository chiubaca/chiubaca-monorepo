packages:
  - apps/*
allowBuilds:
  "@tailwindcss/oxide": true
  core-js-pure: false
  esbuild: true
  exifreader: set this to true or false
  sharp: true
  workerd: true
catalog:
  typescript: ^5.8.3
  wrangler: ^4.105.0
  astro: ^7.0.7
  tailwindcss: ^4.1.6
  "@tailwindcss/vite": ^4.1.6
  "@tailwindcss/typography": ^0.5.16
  "@fontsource/bebas-neue": ^5.2.7
  "@fontsource/jetbrains-mono": ^5.2.8
  "@astrojs/markdown-satteri": ^0.3.2
  satteri: ^0.9.2
  github-slugger: ^2.0.0
  zod: ^4.4.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vitest: 4.1.11
  vite-plus: 0.3.1
minimumReleaseAgeExclude:
  - "@cloudflare/vitest-plugin@1.1.7"
  - "@cloudflare/workerd-darwin-64@1.20260910.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260910.1"
  - "@cloudflare/workerd-linux-64@1.20260910.1"
  - "@cloudflare/workerd-linux-arm64@1.20260910.1"
  - "@cloudflare/workerd-windows-64@1.20260910.1"
  - miniflare@5.20260910.0-alpha
  - workerd@1.20260910.1
  - wrangler@4.131.0
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - sharp
  - workerd
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
